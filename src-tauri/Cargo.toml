[package]
name = "deepwork"
version = "3.0.2"
description = "DeepWork - Pomodoro & Task Management"
authors = ["you"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
log = "0.4"
# The command payloads the frontend receives: `DbReport` crosses the bridge as an
# object rather than as a positional array, so a field can be added to it without
# moving every value after it. Tauri already depends on serde, so this asks for
# the derive it does not enable itself.
serde = { version = "1", features = ["derive"] }
# SHA-384, because that is the hash sqlx records for each migration. The repair
# in `src/db_migrations.rs` recomputes it from the bytes this build embeds, to
# notice a hash that differs only because a checkout rewrote the line endings.
# Pure Rust, no C, and no second copy of SQLite.
sha2 = "0.10"
# Deliberately *not* a SQLite binding. The database guard (`src/db_guard.rs`)
# reads the file's own header and nothing else: the app already links one SQLite
# through `tauri-plugin-sql`, and a second copy of the library — which is what a
# `rusqlite` dependency would either add or fight over — is a size and linkage
# cost for a check that a hundred bytes can make. See that module for what the
# header proves and where the deeper check lives.
# No `devtools` feature, on purpose: that flag is what carries the web inspector
# into a *packaged* build (`tauri-runtime-wry` only calls `with_devtools` behind
# `cfg(any(debug_assertions, feature = "devtools"))`). `tauri dev` keeps its
# inspector without it — debug builds get one either way — so the shipped app has
# no inspect entry, no F12, and nothing to open in the context menu, while the
# development loop is unchanged.
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"

# Windows-only pieces: the per-user "start with Windows" entry, and taking the
# window's own frame away while it is the mini widget.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# WebView2's memory-target API (`ICoreWebView2_19`), for telling Chromium to let
# go of its caches while the window is parked in the tray. The high-level
# `webview2-com` crate does not surface that interface, but its sys bindings do —
# and wry already builds them, so this adds no new crate to the build.
webview2-com = "0.38"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    # `CreateRoundRectRgn`, which gives the widget's window the card's own shape.
    "Win32_Graphics_Gdi",
    # `SetWindowPos` and the topmost styles, for keeping the window above the
    # others rather than only asking the desktop layer to. See `TopmostKeeper`.
    "Win32_UI_WindowsAndMessaging",
    # `SHQueryUserNotificationState`, the one documented answer to "would a
    # notification be welcome right now?" — quiet hours, a fullscreen game, a
    # presentation and a locked screen all come back through it. See `nudges`.
    "Win32_UI_Shell",
] }
# WinRT toasts, for the things the notification plugin cannot do on Windows:
# post under a tag, so the alert's repeat re-raises its own notification instead
# of stacking one copy per interval, and carry buttons whose press reports back
# into the app. See `alert_notify` in `src/lib.rs`.
#
# `UI_Notifications` and `Data_Xml_Dom` are the API itself and the XML document
# it is handed — the toast is built as markup and parsed by `XmlDocument`.
# `Foundation` is `TypedEventHandler`, which is how a button press is heard
# (the toast's `Activated` event). `UI_Shell` is `TaskbarManager`, the one
# documented way to ask the shell to pin the app.
windows = { version = "0.61", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "UI_Shell",
] }
# The `IAsyncOperation` a pin request returns. A direct dependency because the
# completion handler is a type this crate has to name: `windows` re-exports the
# operation but not its handler. Waiting on the operation with `get()` instead
# would block the thread the shell's own consent dialog is drawn on, which is
# the one thread that must stay free for the request to complete.
windows-future = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
