[package]
name = "deepwork"
version = "2.0.21"
description = "DeepWork - Pomodoro & Task Management"
authors = ["you"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
log = "0.4"
# The command payloads the frontend receives: `PinStatus`, `PinOutcome` and
# `DbReport` cross the bridge as objects rather than as positional arrays, so a
# field can be added to one without moving every value after it. Tauri already
# depends on serde, so this asks for the derive it does not enable itself.
serde = { version = "1", features = ["derive"] }
# Deliberately *not* a SQLite binding. The database guard (`src/db_guard.rs`)
# reads the file's own header and nothing else: the app already links one SQLite
# through `tauri-plugin-sql`, and a second copy of the library — which is what a
# `rusqlite` dependency would either add or fight over — is a size and linkage
# cost for a check that a hundred bytes can make. See that module for what the
# header proves and where the deeper check lives.
# No `devtools` feature, on purpose: that flag is what carries the web inspector
# into a *packaged* build (`tauri-runtime-wry` only calls `with_devtools` behind
# `cfg(any(debug_assertions, feature = "devtools"))`). `tauri dev` keeps its
# inspector without it — debug builds get one either way — so the shipped app has
# no inspect entry, no F12, and nothing to open in the context menu, while the
# development loop is unchanged.
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"

# Windows-only pieces: the per-user "start with Windows" entry, and taking the
# window's own frame away while it is the mini widget.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# WebView2's memory-target API (`ICoreWebView2_19`), for telling Chromium to let
# go of its caches while the window is parked in the tray. The high-level
# `webview2-com` crate does not surface that interface, but its sys bindings do —
# and wry already builds them, so this adds no new crate to the build.
webview2-com = "0.38"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    # `MARGINS`, which `DwmExtendFrameIntoClientArea` takes.
    "Win32_UI_Controls",
    # `SetWindowPos` and the topmost styles, for keeping the window above the
    # others rather than only asking the desktop layer to. See `TopmostKeeper`.
    "Win32_UI_WindowsAndMessaging",
] }
# WinRT toasts, for the one thing the notification plugin cannot do on Windows:
# post under a tag, so the alert's repeat re-raises its own notification instead
# of stacking one copy per interval. See `alert_notify` in `src/lib.rs`.
#
# `UI_Shell` is the other half: `Windows.UI.Shell.TaskbarManager` is the one
# supported way to ask Windows to pin the app to the taskbar, and to find out
# whether it already is. See `src/taskbar.rs`. `Foundation` comes with it because
# that is where `IAsyncOperation` and its `AsyncStatus` live: both calls the
# taskbar API offers are asynchronous, and how they are *waited for* is the
# difference between a card the user can click and a frozen window.
windows = { version = "0.61", features = [
    "Foundation",
    "UI_Notifications",
    "UI_Shell",
    "Data_Xml_Dom",
] }
# The async operation types the taskbar API returns, and the `AsyncStatus` that
# says whether one has finished. The `windows` crate hands these back but does not
# re-export them (they live in `windows-future`, the same way `windows-collections`
# is separate), so the polling in `src/taskbar.rs` names them directly. The version
# is the one `windows` 0.61 already resolves to, so this adds no second copy.
windows-future = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
