<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DeepWork</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#8b5cf6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DeepWork">
  <link rel="apple-touch-icon" href="/icons/128x128.png">
  <!-- Capture PWA install prompt before Angular boots (race condition fix) -->
  <script>
    window.__pwaInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.__pwaInstallPrompt = e;
    });
  </script>
  <!-- Apply saved theme before first paint to avoid flash -->
  <script>
    try {
      var t = localStorage.getItem('deepwork_theme');
      if (!t) {
        // fall back to full settings object (browser-mode storage)
        var s = JSON.parse(localStorage.getItem('deepwork_settings') || '{}');
        t = s.theme;
      }
      if (t) document.documentElement.dataset.theme = t;
    } catch (_) { /* storage unavailable — default dark theme applies */ }
  </script>
</head>
<body>
  <app-root></app-root>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => { /* SW unavailable */ });
      });
    }
  </script>
</body>
</html>
