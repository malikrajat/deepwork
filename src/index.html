    <!-- `viewport-fit=cover` lets the page paint into the notch and the home
         indicator on a phone, which is what the app's own background wants: a
         near-black surface that stops short of the edge reads as a rendering
         bug. `black-translucent` (below) already draws the page under the iOS
         status bar when the app is installed, so the layout has to inset itself
         to stay readable — the `env(safe-area-inset-*)` paddings in
         `styles.css` and the shell are the other half of this promise. On a
         desktop browser every one of those insets is 0, so nothing moves. -->

    <!-- Relative, not `/…`: the web build has been served from a sub-path in the
       past, where a root-absolute URL is a 404 on somebody else's site — which
       is exactly what stopped this app being installable. Relative URLs resolve
       against the `<base href>` the build sets, so the same file works at a
       domain root (`app.deepwork.rajatmalik.dev`, the desktop webview,
       `ng serve`) and under a sub-path alike. -->
    <link rel="manifest" href="manifest.webmanifest" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Capture PWA install prompt before Angular boots (race condition fix) -->
    <script>
      window.__pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
      });
    </script>
    <!-- Apply saved theme before first paint to avoid flash -->
    <script>
      try {
        var t = localStorage.getItem('deepwork_theme');
        if (!t) {
          // fall back to full settings object (browser-mode storage)
          var s = JSON.parse(localStorage.getItem('deepwork_settings') || '{}');
          t = s.theme;
        }
        if (t) document.documentElement.dataset.theme = t;
      } catch (_) {
        /* storage unavailable — default dark theme applies */
      }
    </script>

  <body>
    <app-root></app-root>
    <noscript>
      <main>
        <h1>DeepWork</h1>
        <p>
          DeepWork is a free, local-first focus timer and task manager for Windows, macOS, Linux and
          the browser. The application itself needs JavaScript: the focus timer, task board,
          Eisenhower matrix, day planner, habits, journal and analytics are all built in the page.
        </p>
        <p>
          It keeps every task, focus session, habit and journal entry in a database on your own
          machine. There is no account, no cloud sync, no subscription and no telemetry on your
          work. The desktop builds use a local SQLite database; this web build uses your browser's
          own storage and can be installed as an app.
        </p>
        <p>
          Read the full description, screenshots and documentation at
          <a href="https://deepwork.rajatmalik.dev/">deepwork.rajatmalik.dev</a>, download a desktop
          build from
          <a href="https://github.com/malikrajat/deepwork/releases/latest">GitHub Releases</a>, or
          enable JavaScript to use the app here.
        </p>

        </p>

    <script>
      // The packaged desktop app (Tauri) already ships its assets locally and has no
      // installable web origin, so a service worker there only risks serving a stale
      // cached bundle after an update. Register it in browsers only.
      var isDesktopApp = typeof window !== 'undefined' && '__TAURI_INTERNALS__' in window;
      if (!isDesktopApp && 'serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Resolved against the document's own base URL rather than the domain
          // root, so the same file works wherever the app is served from. The
          // deployed build sits at the root of `app.deepwork.rajatmalik.dev`,
          // but `/sw.js` written as an absolute path would break again the day
          // it moved to a sub-path — and a missing service worker is one of the
          // things that makes an app uninstallable. The scope follows the
          // script's own folder, which is the app's folder.
          var swUrl = new URL('sw.js', document.baseURI).href;
          navigator.serviceWorker.register(swUrl).catch(() => {
            /* SW unavailable */
          });
        });
      }
    </script>
