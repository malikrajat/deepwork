<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DeepWork</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico" />
    <!-- Relative, not `/…`: the web build is served from a sub-path on GitHub
       Pages (`/deepwork/`), where a root-absolute URL is a 404 on somebody
       else's site — which is exactly what stopped this app being installable.
       Relative URLs resolve against the `<base href>` the build sets, so the
       same file works at a domain root (the desktop webview, `ng serve`) and
       under a sub-path alike. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#8b5cf6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DeepWork" />
    <link rel="apple-touch-icon" href="icons/icon.png" />
    <!-- Capture PWA install prompt before Angular boots (race condition fix) -->
    <script>
      window.__pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
      });
    </script>
    <!-- Apply saved theme before first paint to avoid flash -->
    <script>
      try {
        var t = localStorage.getItem('deepwork_theme');
        if (!t) {
          // fall back to full settings object (browser-mode storage)
          var s = JSON.parse(localStorage.getItem('deepwork_settings') || '{}');
          t = s.theme;
        }
        if (t) document.documentElement.dataset.theme = t;
      } catch (_) {
        /* storage unavailable — default dark theme applies */
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
    <script>
      // The packaged desktop app (Tauri) already ships its assets locally and has no
      // installable web origin, so a service worker there only risks serving a stale
      // cached bundle after an update. Register it in browsers only.
      var isDesktopApp = typeof window !== 'undefined' && '__TAURI_INTERNALS__' in window;
      if (!isDesktopApp && 'serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Resolved against the document's own base URL rather than the domain
          // root: on GitHub Pages this app lives at `/deepwork/`, and `/sw.js`
          // there is a 404 — the browser then refuses to register anything, and
          // the missing service worker is one of the things that makes an app
          // uninstallable. The scope follows the script's own folder, which is
          // the app's folder.
          var swUrl = new URL('sw.js', document.baseURI).href;
          navigator.serviceWorker.register(swUrl).catch(() => {
            /* SW unavailable */
          });
        });
      }
    </script>
  </body>
</html>
