<!-- The database could not be read: the app is not shown at all. This sits above
     everything, including the mini widget, because an app with no database has
     nothing to be small about. -->
<app-database-error />

@if (!db.failure()) {
  <!--
    The mini widget replaces the window, so nothing else may share it: banners,
    toasts and the first-run dialog would be clipped into a 136x76 frame. The
    completion alert is the exception that proves the rule — the widget answers it
    itself, out of its own controls, because nothing else is there to do it.
  -->
  @if (!ui.isNativeWidget()) {
    <app-install-banner />
    <!-- The explanation behind the banner's How button, the post-install
         startup question, and the browser's one always-on-top option. Deferred
         on idle for the same reason as the quiet panel: it is opened on
         request, and the request may never come. -->
    @defer (on idle) {
      <app-install-dialog />
    }
    <app-toast />
    <!-- Why nothing is interrupting: a pause the user started, or a focus mode
         the machine is in. It sits opposite the card so it explains rather than
         covers, and it is part of the shell because the state is global. -->
    <app-attention-banner />
    <!-- Pause, mute and focus, from any page and any platform. One dialog for
         all three entry points — the sidebar's footer, the phone's top bar and
         Ctrl+Shift+Q — so it cannot mean three different things.

         Deferred on idle, like the visitor dashboard below: it is a modal that
         a visit may never open, and its three blocks of markup are not part of
         the first paint. The idle trigger means it is ready before the first
         click reaches a button, and if it is not, the panel's own state is
         already set — the dialog appears the moment its chunk arrives. -->
    @defer (on idle) {
      <app-quiet-dialog />
    }
    <app-update-prompt />
    <app-welcome-prefs-dialog />
    <!-- The first-run question about starting with the computer. It is separate
         from the preferences dialog above because it is asked once, on an
         install where the answer is not already yes, and because its answer is
         the one the reminders afterwards follow. -->
    <app-launch-prompt-dialog />
    <!-- The visitor dashboard renders from the shell rather than from the settings
         row that opens it. That row sits in a `.setting-group`, which carries a
         `backdrop-filter` — and an element with one becomes the containing block
         for `position: fixed` descendants, so a panel asking for the whole window
         was measured against the card instead and came out the width of a card.
         From here it also sits outside the scrolling content area.

         Deferred to idle, because it is a dashboard's worth of template for a panel
         that a visit may never open: it arrives as its own chunk once the browser is
         free, so it is ready before anyone reaches the button without being part of
         the first load. -->
    @defer (on idle) {
      <app-visitor-stats-dialog />
    }
  }

  <!-- The water nudge renders even while the window is the mini widget, because it
       is what asks the window to come back: it hides itself for the one frame the
       widget is still on screen, and puts the question up once it is not. -->
  <app-water-nudge />

  <!-- The standing reminder is the one question that never gives up. It is drawn
       from the shell because it has to be able to ask from any page, and it hides
       itself in the mini widget: the sticky notification is the surface there. -->
  <app-reminder-card />

  @if (ui.isMiniMode()) {
    <app-mini-widget />
  }
}

<div
  class="app-shell"
  [class.mini-active]="ui.isNativeWidget()"
  [class.banner-open]="installBannerOpen()"
>
  <!-- The phone's only way to the navigation. Rendered always and laid out as
       nothing above the breakpoint (see `app.css`), which is what keeps this one
       template serving both shapes. Focus Mode has no navigation to open, so it
       has no bar either. -->
  @if (!ui.focusMode() && !ui.isNativeWidget()) {
    <header class="mobile-topbar">
      <button
        class="mobile-menu-btn"
        type="button"
        (click)="toggleMobileNav()"
        [attr.aria-expanded]="mobileNavOpen()"
        aria-controls="app-navigation"
        [attr.aria-label]="mobileNavOpen() ? 'Close navigation' : 'Open navigation'"
      >
        @if (mobileNavOpen()) {
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        } @else {
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        }
      </button>

      <span class="mobile-bar-brand">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="url(#mobile-brand-grad)" stroke-width="2" />
          <path
            d="M12 6v6l4 2"
            stroke="url(#mobile-brand-grad)"
            stroke-width="2"
            stroke-linecap="round"
          />
          <defs>
            <linearGradient id="mobile-brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#8b5cf6" />
              <stop offset="100%" stop-color="#06b6d4" />
            </linearGradient>
          </defs>
        </svg>
        <span class="brand-text">DeepWork</span>
      </span>

      <!-- The phone's way into pause, mute and focus. It is in the top bar as
           well as in the drawer because it is the one control a user reaches
           for while working, and opening a navigation menu to stop a reminder is
           the kind of friction that ends with the app muted never to return. -->
      <button
        type="button"
        class="mobile-quiet-btn"
        [class.active]="quiet.active()"
        [attr.aria-label]="quiet.statusLabel()"
        [title]="quiet.statusLabel()"
        (click)="quiet.togglePanel()"
      >
        <svg
          width="19"
          height="19"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" />
          <path d="M13.7 21a2 2 0 01-3.4 0" />
        </svg>
        @if (quiet.active()) {
          <span class="quiet-dot" aria-hidden="true"></span>
        }
      </button>
    </header>
  }

  <!-- Tap anywhere beside the drawer to close it. Decorative to assistive tech:
       the drawer's own close button and Escape are the accessible ways out. -->
  @if (mobileNavOpen() && !ui.focusMode()) {
    <div class="nav-backdrop" aria-hidden="true" (click)="closeMobileNav()"></div>
  }

  <div
    class="app-layout"
    [class.sidebar-collapsed]="sidebarCollapsed()"
    [class.focus-mode]="ui.focusMode()"
  >
    @if (!ui.focusMode()) {
      <app-sidebar
        [collapsed]="sidebarCollapsed() && !isCompactLayout()"
        [mobileOpen]="mobileNavOpen()"
        (toggleCollapse)="toggleSidebar()"
        (closeMobile)="closeMobileNav()"
        [attr.inert]="drawerIsInert() ? '' : null"
        [attr.aria-hidden]="drawerIsInert() ? 'true' : null"
      />
    }
    <main class="main-content">
      @if (ui.focusMode()) {
        <button class="exit-focus-btn" (click)="ui.exitFocusMode()">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
          Exit Focus
        </button>
      }
      <router-outlet />
    </main>
  </div>

  <!-- Add a task for today from any page: type it, or say it in English.
       The shortcut (Ctrl+N) lives with the component so the two never fight. -->
  <app-quick-add />
</div>
