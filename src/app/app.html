<app-install-banner />
<app-toast />
<div class="app-shell">
  <div class="app-layout" [class.sidebar-collapsed]="sidebarCollapsed()" [class.focus-mode]="ui.focusMode()">
    @if (!ui.focusMode()) {
      <app-sidebar
        [collapsed]="sidebarCollapsed()"
        (toggleCollapse)="toggleSidebar()"
      />
    }
    <main class="main-content">
      @if (ui.focusMode()) {
        <button class="exit-focus-btn" (click)="ui.exitFocusMode()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
          Exit Focus
        </button>
      }
      <router-outlet />
    </main>
  </div>
</div>
