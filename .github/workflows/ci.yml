name: CI

# Everything a change has to survive before it is worth building: it must lint,
# be formatted, pass the unit tests, and compile. Runs on every pull request, on
# every push to main, and on demand.
#
# Every run leaves its logs and its pass/fail behind; the installer job goes
# further and uploads what it built, so a run can be downloaded from instead of
# only being read. A version tag is what turns those files into a release
# anyone can install from.
on:
  push:
    branches:
      - main
    # Releases are cut by pushing a `v`-tag. Without this the tag would start no
    # run at all, and the installers it is meant to publish would never be built.
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The version is written down in nine files, and nothing reads any of the
      # others, so a release that updated all but one slips through unless it is
      # checked here.
      - name: Check that every version agrees
        run: npm run version:check

  format:
    name: Format (Prettier)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The commit this push or pull request is compared against has to be
          # in the checkout for the diff below.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Formatting is checked on the files this change touches, not on the whole
      # repository: the app predates Prettier, and a gate that fails on code
      # nobody edited would block every branch. `npm run format` formats
      # everything when you are ready to pay off the rest.
      #
      # Markdown is left out for the same reason it is in `.prettierignore`:
      # prose is reflowed rather than formatted, so a documentation edit would
      # fail a gate about code style. Both lists have to say the same thing.
      - name: Check the formatting of changed files
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --quiet origin "${{ github.base_ref }}"
            BASE="origin/${{ github.base_ref }}"
          elif [ -n "${{ github.event.before }}" ] && ! grep -qE '^0+$' <<< "${{ github.event.before }}"; then
            BASE="${{ github.event.before }}"
          else
            BASE="HEAD~1"
          fi

          CHANGED=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- . \
            ':(exclude)src-tauri' ':(exclude)package-lock.json' \
            ':(exclude)*.md' ':(exclude)*.markdown' ':(exclude)*.mdx' || true)

          if [ -z "$CHANGED" ]; then
            echo "No changed files to check."
            exit 0
          fi

          echo "Checking:"
          echo "$CHANGED"
          echo "$CHANGED" | xargs npx prettier --check --ignore-unknown

  test:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:coverage

      # The thresholds in `vitest.config.ts` fail the run if coverage drops below
      # the floor or if the logic layer leaves 90%; this adds the distance to the
      # 90% goal for the whole app to the run summary.
      - name: Coverage summary
        if: always()
        run: npm run coverage:summary

  build:
    name: Build (ng build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ng build (production)
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Playwright drives the real app in a browser: every screen, every click, the
    # whole stack. The suite is blocking now that it describes the app as it is —
    # it used to run with `continue-on-error`, because a third of its
    # expectations still described the pages before the refactor (the removed
    # dictation panel, the old analytics cards, the matrix panels, the habits
    # calendar, the sidebar labels). Those have been rewritten against the
    # current pages, and three real bugs they were hiding with them: a task panel
    # whose buttons fell below the window when editing, an install banner that
    # covered the sidebar's collapse button, and a habit form that would have
    # accepted an empty name.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # `playwright.config.ts` starts the dev server itself (port 4202).
      - name: Run the end-to-end suite
        run: npm run e2e

  installers:
    name: Installer — ${{ matrix.label }}
    # Building an installer takes 15–25 minutes per OS, so it runs where it is
    # useful — every push to main, every tag, and on demand — and PRs stay fast.
    # Delete this `if:` to build installers on pull requests too.
    if: github.event_name != 'pull_request'
    needs:
      - lint
      - test
      - build
      # The desktop app is the same front end in a webview, so an installer is
      # only worth building for a commit that already passes the browser suite.
      - e2e
    strategy:
      fail-fast: false
      matrix:
        # One entry per installer that is published, which is one per platform
        # *and* architecture: a Mac is either Intel or Apple Silicon, and the two
        # need different builds. macOS is therefore two runs, not one — the
        # `target` is what the bundle is compiled for, and the `installers` are
        # the files the run hands back.
        include:
          - label: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: deepwork-windows-x64
            installers: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          - label: Linux (x64)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: deepwork-linux-x64
            installers: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
          # `macos-latest` is Apple Silicon: GitHub's `-latest` macOS image is
          # arm64, so the Intel build needs the explicitly-labelled Intel runner.
          # `macos-13` used to be that runner; it has been retired.
          - label: macOS (Apple Silicon / arm64)
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: deepwork-macos-arm64
            installers: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - label: macOS (Intel / x64)
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: deepwork-macos-x64
            installers: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Linux build needs the webview and the tray libraries Tauri links
      # against; Windows and macOS ship what they need.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            build-essential

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # A runner can be asked for a triple it does not have by default; the
          # host triple is already installed and this is a no-op for it.
          targets: ${{ matrix.target }}

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # One cache per platform and architecture: a bundle built for Intel is
          # not the same compilation as one built for Apple Silicon.
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      # `tauri build` runs `npm run build` first (see `beforeBuildCommand`), then
      # produces this target's bundles: the NSIS installer on Windows, the
      # AppImage/.deb/.rpm on Linux, the .dmg on macOS.
      - name: Build the installer
        run: npm run tauri:build -- --target ${{ matrix.target }}

      # This is the part that makes an installer downloadable: without it a run
      # only reports that it built something, and the file itself is gone with
      # the runner. The artifact keeps each platform's installers together under
      # a name that says which machine they are for.
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.installers }}
          if-no-files-found: error
          # Two days: long enough to pick the installer up from the run that built
          # it, short enough that a stack of forgotten builds is not left sitting
          # in storage. GitHub deletes them on its own when the window closes —
          # and nothing is lost by that, because a tag is what keeps a build for
          # good: the release job below attaches the same files to a release,
          # where they stay.
          retention-days: 2

  # A tag is what makes the installers a release: the files land on the release
  # page, which is where the app's own "get DeepWork" links look for them. A run
  # on `main` on its own only leaves the artifacts above, which GitHub keeps to
  # the people who can open the run.
  release:
    name: Publish the installers
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - installers
    runs-on: ubuntu-latest
    permissions:
      # The only job that writes anything: attaching files to a release.
      contents: write
    steps:
      - name: Collect every installer
        uses: actions/download-artifact@v4
        with:
          path: installers
          # One flat folder, so the release gets `DeepWork_2.0.17_x64.dmg` rather
          # than a directory per platform.
          merge-multiple: true

      - name: Attach them to the release
        env:
          # `gh` reads the repository from `GH_REPO`; there is no checkout here
          # to read a git remote from.
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes

          # `--clobber` so re-running a tagged build replaces the files it
          # already published instead of failing on the name collision.
          gh release upload "$TAG" installers/* --clobber

          echo "Attached to $TAG:"
          ls -lh installers

  desktop-format:
    name: Desktop format (cargo fmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # The Rust side is formatted by cargo, not Prettier. Only formatting is
      # checked here: compiling the desktop app needs the platform's webview
      # libraries, which belongs on the machine that builds the installer.
      - name: Check the Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
