name: CI

# Everything a change has to survive before it is worth building: it must lint,
# be formatted, pass the unit tests, and compile.
#
# This pipeline runs for `main` and nothing else. There is no `pull_request`
# trigger and no manual trigger, so pushing a feature branch starts no run at
# all and a pull request shows no checks.
#
# A `v`-tag is the one other entry point. A tag is not a branch, and it is not
# optional: without it nothing would ever publish the installers as a release
# anyone can install from.
#
# Every run leaves its logs and its pass/fail behind; the installer job goes
# further and uploads what it built, so a run can be downloaded from instead of
# only being read.
#
# The jobs are independent of one another: each one checks or builds something
# of its own, none of them waits on another to start, and a failure is reported
# against the job it happened in. A red end-to-end suite means the browser suite
# is red — it does not hold back the unit tests, the build, or the installers,
# and it does not stop a `v`-tag from publishing what the installer jobs built.
on:
  push:
    branches:
      - main
    # Releases are cut by pushing a `v`-tag. Without this the tag would start no
    # run at all, and the installers it is meant to publish would never be built.
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The version is written down in nine files, and nothing reads any of the
      # others, so a release that updated all but one slips through unless it is
      # checked here.
      - name: Check that every version agrees
        run: npm run version:check

  format:
    name: Format (Prettier)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The commit this push is compared against has to be in the checkout
          # for the diff below.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Formatting is checked on the files this change touches, not on the whole
      # repository: the app predates Prettier, and a gate that fails on code
      # nobody edited would block every branch. `npm run format` formats
      # everything when you are ready to pay off the rest.
      #
      # Markdown is left out for the same reason it is in `.prettierignore`:
      # prose is reflowed rather than formatted, so a documentation edit would
      # fail a gate about code style. Both lists have to say the same thing.
      - name: Check the formatting of changed files
        run: |
          set -euo pipefail

          # Every run of this workflow is a push, so the comparison point is the
          # commit the push moved away from. A brand-new branch (or a tag) has an
          # all-zero "before", and there the parent commit is the only sensible
          # baseline.
          if [ -n "${{ github.event.before }}" ] && ! grep -qE '^0+$' <<< "${{ github.event.before }}"; then
            BASE="${{ github.event.before }}"
          else
            BASE="HEAD~1"
          fi

          CHANGED=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- . \
            ':(exclude)src-tauri' ':(exclude)package-lock.json' \
            ':(exclude)*.md' ':(exclude)*.markdown' ':(exclude)*.mdx' || true)

          if [ -z "$CHANGED" ]; then
            echo "No changed files to check."
            exit 0
          fi

          echo "Checking:"
          echo "$CHANGED"
          echo "$CHANGED" | xargs npx prettier --check --ignore-unknown

  test:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:coverage

      # The thresholds in `vitest.config.ts` fail the run if coverage drops below
      # the floor or if the logic layer leaves 90%; this adds the distance to the
      # 90% goal for the whole app to the run summary.
      - name: Coverage summary
        if: always()
        run: npm run coverage:summary

  build:
    name: Build (ng build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ng build (production)
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # The suite takes four to fifteen minutes. This cap is not for the tests —
    # Playwright times each of those out itself — but for a step that hangs
    # instead of failing. `apt`, which `playwright install --with-deps` runs, has
    # no network timeout of its own, and a stalled mirror parked this job until
    # GitHub's six-hour default cancelled it, reporting "cancelled" with no
    # failing step to look at. Half an hour leaves room for a retried install
    # and still ends in a failure that says which step it was.
    timeout-minutes: 30
    # Playwright drives the real app in a browser: every screen, every click, the
    # whole stack. The suite is blocking now that it describes the app as it is —
    # it used to run with `continue-on-error`, because a third of its
    # expectations still described the pages before the refactor (the removed
    # dictation panel, the old analytics cards, the matrix panels, the habits
    # calendar, the sidebar labels). Those have been rewritten against the
    # current pages, and three real bugs they were hiding with them: a task panel
    # whose buttons fell below the window when editing, an install banner that
    # covered the sidebar's collapse button, and a habit form that would have
    # accepted an empty name.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        # `--with-deps` shells out to apt, which waits on a network operation
        # forever by default: the stalled mirror that used to hang this job for
        # six hours never printed an error, it simply stopped. These timeouts
        # turn that into a failure in a minute or two, `Retries` lets a single
        # bad mirror recover, and `timeout` bounds the whole invocation for the
        # stalls the apt settings do not cover.
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail

          sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null <<'EOF'
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Acquire::ftp::Timeout "30";
          Acquire::Retries "3";
          EOF

          timeout 600 npx playwright install --with-deps chromium

      # `playwright.config.ts` starts the dev server itself (port 4202).
      - name: Run the end-to-end suite
        run: npm run e2e

  installers:
    name: Installer — ${{ matrix.label }}
    # No `needs`: this job consumes nothing the other jobs produce, so it waits
    # on none of them. Lint, the unit tests and the browser suite report their
    # own result, and one of them going red cannot leave a commit that builds
    # without an installer to show for it. `tauri build` runs `npm run build`
    # itself (see `beforeBuildCommand`), so a front end that does not compile
    # still fails here, on its own evidence.
    #
    # Building an installer takes 15–25 minutes per OS, so it runs for every run
    # of this workflow — which is a push to `main` or a `v`-tag, never a branch
    # and never a pull request. Nothing here needs to filter by event again.
    strategy:
      fail-fast: false
      # One entry per installer that is published: one per platform *and*
      # architecture. A Mac is either Intel or Apple Silicon and a PC is either
      # 64-bit or 32-bit, and each needs a build of its own — so Windows and
      # macOS are two entries each, and Linux is one.
      #
      # `continue-on-error` marks the one entry that carries it: 32-bit Windows,
      # the least certain toolchain of the set. The release job waits on this one,
      # so a job that cannot build must not be allowed to fail the matrix: the
      # other installers would lose their release because a 32-bit runner was
      # missing a package. A failure is still reported in the run; it just cannot
      # take the other architectures' files down with it.
      matrix:
        include:
          - label: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: deepwork-windows-x64
            installers: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          # 32-bit Windows, for a 32-bit PC and for 64-bit Windows running 32-bit
          # software. Tauri names the installer for the target it was built for —
          # `…_x86-setup.exe` beside `…_x64-setup.exe` — and the release job
          # checks that rather than assuming it, because two files with one name
          # would silently overwrite each other on the release.
          - label: Windows (x86)
            os: windows-latest
            target: i686-pc-windows-msvc
            artifact: deepwork-windows-x86
            continue-on-error: true
            installers: |
              src-tauri/target/i686-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/i686-pc-windows-msvc/release/bundle/msi/*.msi
          - label: Linux (x64)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: deepwork-linux-x64
            installers: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
          # There is no 32-bit Linux entry, and there cannot be one on this
          # runner. DeepWork's tray is a required Cargo feature
          # (`tauri = { features = ["tray-icon"] }`), and Ubuntu publishes no
          # appindicator library for i386 at all: `libappindicator3-dev` and
          # `libayatana-appindicator3-dev` are built for amd64, arm64, armhf,
          # ppc64el, riscv64 and s390x — never i386, in jammy or in noble. The
          # entry this replaces therefore failed inside `apt-get install` on
          # every run it ever had, before it could try to compile anything. A
          # 32-bit Linux build needs a Debian i386 environment, which is a
          # different job rather than another line in this matrix.
          #
          # `macos-latest` is Apple Silicon: GitHub's `-latest` macOS image is
          # arm64, so the Intel build needs the explicitly-labelled Intel runner.
          # `macos-13` used to be that runner; it has been retired.
          #
          # There is no 32-bit macOS entry and there cannot be one: Apple removed
          # 32-bit application support in macOS 10.15.
          - label: macOS (Apple Silicon / arm64)
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: deepwork-macos-arm64
            installers: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - label: macOS (Intel / x64)
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: deepwork-macos-x64
            installers: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    # The one flag the 32-bit Windows entry carries into the job itself.
    continue-on-error: ${{ matrix.continue-on-error || false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Linux build needs the webview and the tray libraries Tauri links
      # against; Windows and macOS ship what they need.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            build-essential

      # The i386 half of the same story used to live here, for a 32-bit Linux
      # entry this matrix no longer has — see the note in the matrix for why
      # (Ubuntu builds no appindicator library for i386, so the tray Tauri links
      # against cannot be satisfied there). One architecture, one package list.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # A runner can be asked for a triple it does not have by default; the
          # host triple is already installed and this is a no-op for it.
          targets: ${{ matrix.target }}

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # One cache per platform and architecture: a bundle built for Intel is
          # not the same compilation as one built for Apple Silicon.
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      # `tauri build` runs `npm run build` first (see `beforeBuildCommand`), then
      # produces this target's bundles: the NSIS installer on Windows, the
      # AppImage/.deb/.rpm on Linux, the .dmg on macOS. One target per job, on the
      # runner that matches it, with no cross-compilation flags to keep honest.
      - name: Build the installer
        if: runner.os != 'macOS'
        run: npm run tauri:build -- --target ${{ matrix.target }}

      # The Developer ID certificate has to exist in a keychain on the runner
      # before `tauri build` can sign anything. The step is a no-op when the
      # secrets are not configured, so a repository without an Apple account still
      # builds the same unsigned DMG it always did.
      #
      # Gatekeeper's "Apple could not verify…" dialog is not a property of the
      # app: it is the absence of this certificate and a notarization ticket. A
      # build made locally is openable because it never came from the internet and
      # carries no quarantine flag; a downloaded CI build does, and this is what
      # makes the two behave the same.
      - name: Import the Apple Developer ID certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "::notice::APPLE_CERTIFICATE is not configured; this DMG will be unsigned."
            exit 0
          fi

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          rm -f "$RUNNER_TEMP/certificate.p12"

      # The .dmg is built by a copy of create-dmg that mounts a scratch image,
      # copies the .app into it and detaches it again. On GitHub's macOS runners
      # XProtect can keep scanning that image long enough for `hdiutil` to answer
      # "Resource busy", and the whole bundling step exits non-zero — the same
      # commit passes on a rerun, and it never happens on a developer's Mac
      # (actions/runner-images#7522). So the bundle is attempted up to three
      # times: the Rust build is already compiled by the second attempt, and
      # Tauri removes its previous bundle directory before writing a new one.
      #
      # `--verbose` is not noise: it is what makes the bundler echo the output of
      # bundle_dmg.sh line by line. Without it a failed DMG prints only
      # "failed to run bundle_dmg.sh" and the failing `hdiutil` call is lost,
      # which is exactly what made this failure unreadable in the first place.
      - name: Build the installer (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          # Signing (certificate + identity) and notarization (Apple ID + app
          # specific password + team) are separate credentials. Tauri only does
          # either when the variables it needs are present, so an empty secret
          # has to be *absent*, not set to "" — hence the `unset` below.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          # If the certificate secret is present but the identity was left to the
          # keychain, take the Developer ID the import step just installed.
          if [ -n "${APPLE_CERTIFICATE:-}" ] && [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            APPLE_SIGNING_IDENTITY=$(security find-identity -v -p codesigning build.keychain \
              | awk -F'"' '/Developer ID Application/ {print $2; exit}')
            if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
              echo "::error::the keychain holds no Developer ID Application identity"
              security find-identity -v -p codesigning build.keychain
              exit 1
            fi
            export APPLE_SIGNING_IDENTITY
          fi

          # No certificate, no signing: clear every Apple variable rather than
          # handing Tauri empty strings it would try to use. With one, the .p12
          # is already in the keychain, so drop it from the environment too and
          # leave the build with the identity and the notary credentials.
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          else
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD
          fi

          # One log survives the last attempt even when the step fails, so the
          # `hdiutil` line behind a red job can still be read in the run.
          log="$RUNNER_TEMP/tauri-build-macos.log"

          for attempt in 1 2 3; do
            if npm run tauri:build -- --target "${{ matrix.target }}" --verbose 2>&1 | tee "$log"; then
              exit 0
            fi

            # Retry only the bundling flake. A compile error is not going to
            # clear by waiting, and retrying it would just print it three times.
            if ! grep -qE 'bundle_dmg\.sh|hdiutil' "$log"; then
              echo "::error::the installer failed outside the DMG step"
              exit 1
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::the DMG step failed three times; its hdiutil output is above"
              exit 1
            fi

            echo "::warning::DMG attempt $attempt failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done

      # The bundle is only worth publishing if the ticket is really on it. This
      # reads it back the way Gatekeeper will, rather than trusting that the
      # environment variables were enough.
      - name: Verify the macOS signature and notarization ticket
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          if [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "${APPLE_ID:-}" ] \
            || [ -z "${APPLE_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "::notice::Signing or notarization credentials are incomplete; skipping verification."
            exit 0
          fi

          app="src-tauri/target/$TARGET/release/bundle/macos/DeepWork.app"

          # The signature covers the whole bundle, not only the executable.
          codesign --verify --deep --strict --verbose=2 "$app"
          # The ticket is what lets a quarantined copy open without a warning.
          xcrun stapler validate "$app"
          # And this is the exact question Gatekeeper asks on first launch.
          spctl --assess --type execute --verbose=4 "$app"

      # This is the part that makes an installer downloadable: without it a run
      # only reports that it built something, and the file itself is gone with
      # the runner. The artifact keeps each platform's installers together under
      # a name that says which machine they are for.
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.installers }}
          if-no-files-found: error
          # Two days: long enough to pick the installer up from the run that built
          # it, short enough that a stack of forgotten builds is not left sitting
          # in storage. GitHub deletes them on its own when the window closes —
          # and nothing is lost by that, because a tag is what keeps a build for
          # good: the release job below attaches the same files to a release,
          # where they stay.
          retention-days: 2

  # A tag is what makes the installers a release: the files land on the release
  # page, which is where the app's own "get DeepWork" links look for them. A run
  # on `main` on its own only leaves the artifacts above, which GitHub keeps to
  # the people who can open the run.
  release:
    name: Publish the installers
    if: startsWith(github.ref, 'refs/tags/v')
    # The one dependency left in this workflow, and a data one rather than a
    # gate: this job attaches the files the installer jobs upload, so it has to
    # wait for those files to exist. It is not waiting on the checks — a tag
    # publishes whatever the installers built, and GitHub reports the checks
    # beside the release rather than holding it back.
    needs:
      - installers
    runs-on: ubuntu-latest
    permissions:
      # The only job that writes anything: attaching files to a release.
      contents: write
    steps:
      - name: Collect every installer
        uses: actions/download-artifact@v4
        with:
          path: installers
          # One flat folder, so the release gets `DeepWork_2.0.17_x64.dmg` rather
          # than a directory per platform.
          merge-multiple: true

      # Two architectures writing one file name would mean one of them silently
      # replacing the other, and the release would look complete while missing a
      # platform. The names are expected to differ (`_x64`/`_x86`, `.AppImage`
      # per target), so this states the expectation instead of trusting it.
      - name: Check that no two installers share a name
        run: |
          set -euo pipefail

          duplicates=$(find installers -type f -printf '%f\n' | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "These files were published by more than one architecture:"
            echo "$duplicates"
            echo "Rename one of them before the release can be attached."
            exit 1
          fi

          echo "Every installer has a name of its own:"
          find installers -type f -printf '%f\n' | sort

      - name: Attach them to the release
        env:
          # `gh` reads the repository from `GH_REPO`; there is no checkout here
          # to read a git remote from.
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes

          # `--clobber` so re-running a tagged build replaces the files it
          # already published instead of failing on the name collision.
          gh release upload "$TAG" installers/* --clobber

          echo "Attached to $TAG:"
          ls -lh installers

  desktop-format:
    name: Desktop format (cargo fmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # The Rust side is formatted by cargo, not Prettier. Only formatting is
      # checked here: compiling the desktop app needs the platform's webview
      # libraries, which belongs on the machine that builds the installer.
      - name: Check the Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
