name: Deploy Angular App to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      # Builds for the `/deepwork/` sub-path and then writes the shell out again
      # as `404.html` (scripts/pages-404.mjs). Pages has no rewrite rules, so
      # without that file a refresh on `/deepwork/tasks` is answered by GitHub's
      # own "File not found" page; with it, the app is served and routes itself.
      # Both files are in `dist/deepwork/browser` by the time this step ends.
      - name: Build Deepwork
        run: npm run build:github

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/deepwork/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
